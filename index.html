<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Outil open source d'évaluation de maturité Zero Trust (CISA ZTMM v2.0) : diagnostic, analyse d'écarts et feuille de route chiffrée." />
    <title>Boussole Zero Trust</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14" />
          <path d="M16 5 L19.5 16 L16 27 L12.5 16 Z" />
          <circle cx="16" cy="16" r="2" />
        </svg>
        <div>
          <h1>Boussole Zero Trust</h1>
          <p class="brand-sub">Diagnostic de maturité · CISA Zero Trust Maturity Model v2.0</p>
        </div>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Actions sur l'évaluation">
        <button type="button" class="btn" id="btn-demo">Charger l'exemple</button>
        <button type="button" class="btn" id="btn-import">Importer</button>
        <button type="button" class="btn" id="btn-export">Exporter</button>
        <button type="button" class="btn" id="btn-print">Rapport PDF</button>
        <button type="button" class="btn btn-ghost" id="btn-reset">Réinitialiser</button>
        <input type="file" id="file-input" accept="application/json,.json" hidden />
      </div>
    </header>

    <nav class="tabs" aria-label="Étapes">
      <a href="#contexte" data-view="contexte"><span class="tab-num">1</span>Contexte</a>
      <a href="#evaluation" data-view="evaluation"><span class="tab-num">2</span>Évaluation</a>
      <a href="#resultats" data-view="resultats"><span class="tab-num">3</span>Résultats</a>
      <a href="#feuille-de-route" data-view="feuille-de-route"><span class="tab-num">4</span>Feuille de route</a>
    </nav>

    <div class="print-header" id="print-header"></div>

    <main>
      <section class="view" id="view-contexte" data-view="contexte" aria-label="Contexte"></section>
      <section class="view" id="view-evaluation" data-view="evaluation" aria-label="Évaluation"></section>
      <section class="view" id="view-resultats" data-view="resultats" aria-label="Résultats"></section>
      <section class="view" id="view-feuille-de-route" data-view="feuille-de-route" aria-label="Feuille de route"></section>
    </main>

    <div class="guide" id="guide"></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="app-footer">
      <p>
        Vos données restent dans ce navigateur : aucun serveur, aucune requête externe.
        Référentiel adapté du <a href="https://www.cisa.gov/zero-trust-maturity-model" rel="noopener noreferrer">CISA ZTMM v2.0</a>.
        Estimations indicatives, à affiner en atelier.
      </p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
